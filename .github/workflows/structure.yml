name: Skill structure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: 结构校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验 SKILL.md 结构（官方规范，静态、零依赖）
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import re, sys, pathlib

          d = pathlib.Path(".").resolve()
          f = d / "SKILL.md"
          if not f.is_file():
              sys.exit("缺 SKILL.md")

          text = f.read_text(encoding="utf-8")
          m = re.match(r"^---\s*\n(.*?)\n---\s*\n?", text, re.S)
          if not m:
              sys.exit("frontmatter 未正确闭合")

          fields, body = {}, text[m.end():]
          for line in m.group(1).splitlines():
              if line and line[0] not in " \t#" and ":" in line:
                  k, v = line.split(":", 1)
                  fields[k.strip()] = v.strip()

          errs = []
          name = fields.get("name", "")
          if not name:
              errs.append("缺 name")
          else:
              if len(name) > 64:
                  errs.append(f"name 超 64 字符（{len(name)}）")
              if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", name):
                  errs.append(f"name 格式不合规：{name!r}")
              if name != d.name:
                  errs.append(f"name（{name!r}）与目录名（{d.name!r}）不一致")
              for w in ("anthropic", "claude"):
                  if w in name.lower():
                      errs.append(f"name 含保留词 {w!r}")

          desc = fields.get("description", "")
          if not desc:
              errs.append("缺 description")
          elif len(desc) > 1024:
              errs.append(f"description 超 1024 字符（{len(desc)}）")

          n = body.count("\n") + 1
          if n > 500:
              errs.append(f"正文 {n} 行，超 500 行——应拆到 references/")

          for ref in re.findall(r"`(references/[^`]+)`", body):
              if ref.count("/") > 1:
                  errs.append(f"深链引用：{ref}")

          if errs:
              print("\n".join("  ✗ " + e for e in errs))
              sys.exit(1)
          print(f"  OK  name={name} · 正文 {n} 行 · description {len(desc)} 字符")
          PY
